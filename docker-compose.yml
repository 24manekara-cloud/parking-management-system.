version: '3.8'

services:
  # ── MySQL 8 Database Service ──────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: parking-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: parking_management
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - parking-net

  # ── Smart Parking Management Spring Boot Application ──────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parking-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: parking_management
      DB_USER: root
      DB_PASSWORD: rootpassword
      SERVER_PORT: 8080
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - parking-net

volumes:
  mysql_data:
    driver: local

networks:
  parking-net:
    driver: bridge
